[project]
name = "marimo-faas-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# marimo cells end in a bare expression (rendered output) and an explicit return.
"notebooks/*.py" = ["B018", "PLR1711"]

[tool.pytest.ini_options]
pythonpath = ["notebooks"]
testpaths = ["tests"]
